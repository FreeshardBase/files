<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeShard Files</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span>📁</span> FreeShard Files
      </div>
      <ul class="nav-list">
        <li class="nav-item active"><a href="#/files"><span>🏠</span> <span data-i18n="nav.home">Home</span></a></li>
        <li class="nav-item"><a href="#/shared"><span>🔗</span> <span data-i18n="nav.shared">Shared with me</span></a></li>
        <li class="nav-item"><a href="#/trash"><span>🗑️</span> <span data-i18n="nav.trash">Trash</span></a></li>
        <li class="nav-item"><a href="#/activity"><span>🕒</span> <span data-i18n="nav.activity">Activity</span></a></li>
        <li class="nav-item"><a href="#/settings"><span>⚙️</span> <span data-i18n="nav.settings">Settings</span></a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header -->
      <header class="header">
        <input type="text" class="search-bar" placeholder="Search files and content..." id="searchInput">
        <div id="userMenu"></div>
      </header>

      <!-- Toolbar & Breadcrumb -->
      <div class="toolbar-area">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="action-buttons">
          <button class="btn btn-secondary" id="btnNewFolder">➕ <span data-i18n="files.new_folder">New Folder</span></button>
          <label class="btn btn-primary" style="margin: 0; cursor: pointer;">
            📤 <span data-i18n="files.upload">Upload</span>
            <input type="file" id="fileInput" multiple style="display: none;">
          </label>
          <div class="view-toggle">
            <button class="btn btn-icon active" id="btnGridView" title="Grid View">🔲</button>
            <button class="btn btn-icon" id="btnListView" title="List View">☰</button>
          </div>
        </div>
      </div>

      <!-- Main File Container (Grid / List) -->
      <div class="content-area" id="contentArea">
        <div class="drop-overlay" id="dropOverlay">
          <div class="drop-message">
            <span style="font-size: 3rem;">📥</span>
            <p>Drop files here to upload to current directory</p>
          </div>
        </div>

        <div id="fileContainer" class="grid-view"></div>
      </div>
    </main>
  </div>

  <!-- Context Menu -->
  <div id="contextMenu" class="context-menu" style="display: none;">
    <div class="context-menu-item" id="ctxOpen">📂 Open / Preview</div>
    <div class="context-menu-item" id="ctxDownload">⬇️ Download</div>
    <div class="context-menu-item" id="ctxRename">✏️ Rename</div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item danger" id="ctxDelete">🗑️ Delete</div>
  </div>

  <!-- Modal: New Folder -->
  <div id="modalNewFolder" class="modal" style="display: none;">
    <div class="modal-content">
      <h3 style="margin-bottom: 1rem;">Create New Folder</h3>
      <input type="text" id="inputFolderName" class="modal-input" placeholder="Folder Name">
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btnCancelNewFolder">Cancel</button>
        <button class="btn btn-primary" id="btnConfirmNewFolder">Create</button>
      </div>
    </div>
  </div>

  <!-- Modal: Rename -->
  <div id="modalRename" class="modal" style="display: none;">
    <div class="modal-content">
      <h3 style="margin-bottom: 1rem;">Rename Item</h3>
      <input type="text" id="inputRenameName" class="modal-input" placeholder="New Name">
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btnCancelRename">Cancel</button>
        <button class="btn btn-primary" id="btnConfirmRename">Rename</button>
      </div>
    </div>
  </div>

  <!-- Modal: Media & File Viewer Overlay (#11) -->
  <div id="modalMediaViewer" class="media-viewer-modal" style="display: none;">
    <div class="media-viewer-header">
      <span id="mediaTitle" class="media-title">File Preview</span>
      <div class="media-controls">
        <button class="btn btn-secondary text-sm" id="btnMediaDownload">⬇️ Download</button>
        <button class="btn btn-secondary text-sm" id="btnMediaClose">✖ Close</button>
      </div>
    </div>
    <div class="media-viewer-body" id="mediaViewerBody">
      <!-- Dynamic Media Content Injected Here -->
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/filebrowser.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
