<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeShard Files — Daylight Instrument</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <!-- Brand Diamond Logomark + Shard ID -->
        <div class="shard-badge">
          <span class="shard-diamond">◆</span>
          <span class="shard-id fs-mono">fs-6a8f9b</span>
        </div>
      </div>
      <ul class="nav-list">
        <li class="nav-item active"><a href="#/files"><span class="nav-icon">🏠</span> <span class="fs-label" data-i18n="nav.home">Home</span></a></li>
        <li class="nav-item"><a href="#/shared"><span class="nav-icon">🔗</span> <span class="fs-label" data-i18n="nav.shared">Shared with me</span></a></li>
        <li class="nav-item"><a href="#/trash"><span class="nav-icon">🗑️</span> <span class="fs-label" data-i18n="nav.trash">Trash</span></a></li>
        <li class="nav-item"><a href="#/activity"><span class="nav-icon">🕒</span> <span class="fs-label" data-i18n="nav.activity">Activity</span></a></li>
        <li class="nav-item"><a href="#/settings"><span class="nav-icon">⚙️</span> <span class="fs-label" data-i18n="nav.settings">Settings</span></a></li>
      </ul>
      
      <!-- Theme Switcher Footer -->
      <div class="sidebar-footer">
        <div class="theme-toggle-box">
          <span class="fs-label">Theme</span>
          <button id="btnThemeToggle" class="fs-btn text-sm">🌗 Switch</button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header -->
      <header class="header">
        <input type="text" class="fs-input search-bar" placeholder="Search files and content..." id="searchInput">
        <div id="userMenu"></div>
      </header>

      <!-- Toolbar & Breadcrumb -->
      <div class="toolbar-area">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="action-buttons">
          <button class="fs-btn" id="btnNewFolder">➕ <span data-i18n="files.new_folder">New Folder</span></button>
          <label class="fs-btn fs-btn--primary" style="margin: 0; cursor: pointer;">
            📤 <span data-i18n="files.upload">Upload</span>
            <input type="file" id="fileInput" multiple style="display: none;">
          </label>
          <div class="view-toggle">
            <button class="fs-btn btn-icon active" id="btnGridView" title="Grid View">🔲</button>
            <button class="fs-btn btn-icon" id="btnListView" title="List View">☰</button>
          </div>
        </div>
      </div>

      <!-- Main File Container (Grid / List) -->
      <div class="content-area" id="contentArea">
        <div class="drop-overlay" id="dropOverlay">
          <div class="drop-message">
            <span style="font-size: 3rem;">📥</span>
            <p class="fs-mono" style="margin-top: 0.5rem;">Drop files here to upload to current directory</p>
          </div>
        </div>

        <div id="fileContainer" class="grid-view"></div>
      </div>

      <!-- Multi-Select Floating Action Bar (#12) -->
      <div id="selectionActionBar" class="selection-action-bar" style="display: none;">
        <span id="selectedCountText" class="selected-count fs-mono">0 items selected</span>
        <div class="selection-actions">
          <button class="fs-btn text-sm" id="btnBatchZip">📦 Download Zip</button>
          <button class="fs-btn fs-btn--danger text-sm" id="btnBatchDelete">🗑️ Delete Selected</button>
          <button class="fs-btn text-sm" id="btnDeselectAll">✖ Deselect All</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Context Menu -->
  <div id="contextMenu" class="context-menu" style="display: none;">
    <div class="context-menu-item" id="ctxOpen">📂 Open / Preview</div>
    <div class="context-menu-item" id="ctxDownload">⬇️ Download</div>
    <div class="context-menu-item" id="ctxRename">✏️ Rename</div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item danger" id="ctxDelete">🗑️ Delete</div>
  </div>

  <!-- Modal: New Folder -->
  <div id="modalNewFolder" class="modal" style="display: none;">
    <div class="modal-content fs-sheet">
      <h3 style="margin-bottom: 1rem; font-size: var(--fs-h3);">Create New Folder</h3>
      <input type="text" id="inputFolderName" class="fs-input" placeholder="Folder Name">
      <div class="modal-actions" style="margin-top: 1rem;">
        <button class="fs-btn" id="btnCancelNewFolder">Cancel</button>
        <button class="fs-btn fs-btn--primary" id="btnConfirmNewFolder">Create</button>
      </div>
    </div>
  </div>

  <!-- Modal: Rename -->
  <div id="modalRename" class="modal" style="display: none;">
    <div class="modal-content fs-sheet">
      <h3 style="margin-bottom: 1rem; font-size: var(--fs-h3);">Rename Item</h3>
      <input type="text" id="inputRenameName" class="fs-input" placeholder="New Name">
      <div class="modal-actions" style="margin-top: 1rem;">
        <button class="fs-btn" id="btnCancelRename">Cancel</button>
        <button class="fs-btn fs-btn--primary" id="btnConfirmRename">Rename</button>
      </div>
    </div>
  </div>

  <!-- Modal: Media & File Viewer Overlay -->
  <div id="modalMediaViewer" class="media-viewer-modal" style="display: none;">
    <div class="media-viewer-header">
      <span id="mediaTitle" class="media-title fs-mono">File Preview</span>
      <div class="media-controls">
        <button class="fs-btn text-sm" id="btnMediaDownload">⬇️ Download</button>
        <button class="fs-btn text-sm" id="btnMediaClose">✖ Close</button>
      </div>
    </div>
    <div class="media-viewer-body" id="mediaViewerBody"></div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/filebrowser.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
