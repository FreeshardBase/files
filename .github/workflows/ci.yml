name: CI

# Builds and tests only. Nothing is published: no registry push, no release uploads (maintainer decision
# 2026-10-15, git holds code only). The image is built to prove the Dockerfile works, then discarded.
on:
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Thumbnail generators used by the server tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm e2e

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (not pushed)
        run: docker build -t freeshard-files:ci .
